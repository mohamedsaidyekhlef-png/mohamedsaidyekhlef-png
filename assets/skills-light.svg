<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Three overlapping skills: AI engineering, GEO and finance. AI that gets cited, models that price risk, traffic that pays for itself. Where all three meet: founder."><style>
.pulse{animation:p 2.6s ease-in-out infinite}.flow{stroke-dasharray:6 8;animation:f 1.6s linear infinite}
.d2{animation-delay:.9s}.d3{animation-delay:1.7s}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}@keyframes f{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style><rect width="1280" height="600" rx="18" fill="#F6F7FA"/><g font-family="Schibsted Grotesk, Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><circle cx="560" cy="235" r="150" fill="#2F5BEA" fill-opacity="0.12" stroke="#2F5BEA" stroke-width="2.5"/><circle cx="720" cy="235" r="150" fill="#14935F" fill-opacity="0.12" stroke="#14935F" stroke-width="2.5"/><circle cx="640" cy="375" r="150" fill="#C98A06" fill-opacity="0.12" stroke="#C98A06" stroke-width="2.5"/><text x="64" y="120" font-size="34" font-weight="800" fill="#2F5BEA">AI engineering</text><text x="64" y="156" font-size="20" fill="#566175">Agents · automation</text><text x="64" y="184" font-size="20" fill="#566175">fine-tuned models</text><text x="1216" y="120" text-anchor="end" font-size="34" font-weight="800" fill="#14935F">GEO</text><text x="1216" y="156" text-anchor="end" font-size="20" fill="#566175">Found and cited</text><text x="1216" y="184" text-anchor="end" font-size="20" fill="#566175">in AI answers</text><text x="1216" y="470" text-anchor="end" font-size="34" font-weight="800" fill="#C98A06">Finance</text><text x="1216" y="506" text-anchor="end" font-size="20" fill="#566175">Cash flows · valuation</text><text x="1216" y="534" text-anchor="end" font-size="20" fill="#566175">risk</text><line x1="300" y1="140" x2="440" y2="170" stroke="#2F5BEA" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="1050" y1="140" x2="850" y2="170" stroke="#14935F" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="1050" y1="490" x2="770" y2="440" stroke="#C98A06" stroke-width="1.5" stroke-dasharray="4 5"/><text x="640" y="160" text-anchor="middle" font-size="17" font-weight="600" fill="#141B2A">AI that</text><text x="640" y="182" text-anchor="middle" font-size="17" font-weight="600" fill="#141B2A">gets cited</text><text x="566" y="352" text-anchor="middle" font-size="17" font-weight="600" fill="#141B2A">Models that</text><text x="566" y="374" text-anchor="middle" font-size="17" font-weight="600" fill="#141B2A">price risk</text><text x="714" y="352" text-anchor="middle" font-size="17" font-weight="600" fill="#141B2A">Traffic that</text><text x="714" y="374" text-anchor="middle" font-size="17" font-weight="600" fill="#141B2A">pays for itself</text><circle class="pulse" cx="640" cy="272" r="40" fill="#141B2A"/><text x="640" y="278" text-anchor="middle" font-size="17" font-weight="800" fill="#F6F7FA">Founder</text></g></svg>