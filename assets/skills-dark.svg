"#EEF1F6">price risk</text><text x="714" y="352" text-anchor="middle" font-size="17" font-weight="600" fill="#EEF1F6">Traffic that</text><text x="714" y="374" text-anchor="middle" font-size="17" font-weight="600" fill="#EEF1F6">pays for itself</text><circle class="pulse" cx="640" cy="272" r="40" fill="#EEF1F6"/><text x="640" y="278" text-anchor="middle" font-size="17" font-weight="800" fill="#0F1420">Founder</text></g></svg>